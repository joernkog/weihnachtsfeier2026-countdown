<div class="grain" aria-hidden="true"></div>

<header class="hero">
  <h1>
    <span>Die schnellste</span><br />
    <span class="flash">Weihnachtsfeier</span>
    <span>der Stadt</span>
  </h1>
</header>

<main class="layout">
  <div class="col">
    <app-countdown />

    <section class="panel garage">
      <h2>Rennsimulator</h2>
      <p>Wartezeit? Ab in den Simulator und Bestzeit holen.</p>
      <a class="cta" [href]="raceSimUrl" target="_blank" rel="noopener noreferrer">
        Simulator starten
      </a>
    </section>
  </div>

  <section class="col stage">
    <app-turntable />
  </section>

  <div class="col">
    <app-playlist />
    <app-effects />
  </div>
</main>

<app-street />
